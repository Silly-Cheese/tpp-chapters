<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151411">
  <meta name="robots" content="noindex">
  <title>Redirecting | The Prayer Project</title>
  <link rel="icon" href="assets/brand-mark.svg" type="image/svg+xml">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#181611;background:#f7f1e6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 15% 10%,rgba(179,138,54,.14),transparent 34%),linear-gradient(145deg,#f5ecdc,#fffdf8)}main{width:min(620px,100%);padding:clamp(1.5rem,5vw,3rem);border:1px solid rgba(38,30,17,.14);border-radius:24px;background:rgba(255,253,248,.96);box-shadow:0 24px 64px rgba(25,20,11,.12);text-align:center}img{width:64px;height:64px}p:first-of-type{margin:1.25rem 0 .4rem;color:#b38a36;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2rem,7vw,4rem);line-height:1.02}p{color:#70685a;line-height:1.65}a{display:inline-flex;justify-content:center;margin-top:.8rem;padding:.8rem 1.1rem;border-radius:10px;background:#181611;color:white;text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid #b38a36;outline-offset:3px}@media(prefers-color-scheme:dark){:root{color:#fff8ec;background:#14120f}body{background:#14120f}main{background:#211e18;border-color:rgba(255,255,255,.12)}p{color:#c1b6a4}a{background:#f1e7d3;color:#181611}}</style>
  <script>
    (() => {
      const path = location.pathname.replace(/^\/+|\/+$/g, "");
      const known = new Set(["verify", "chapters", "report-chapter", "activate", "login", "dashboard", "admin"]);
      const first = path.split("/")[0];
      const target = path && known.has(first)
        ? `/#/${path}${location.search}`
        : "/#/";
      setTimeout(() => location.replace(target), 120);
    })();
  </script>
</head>
<body>
  <main>
    <img src="assets/brand-mark.svg" alt="The Prayer Project">
    <p>Restoring portal route</p>
    <h1>Taking you back to the chapter portal.</h1>
    <p>GitHub Pages received a direct route. The portal will reopen the matching hash-based address when possible.</p>
    <a href="./#/">Return now</a>
  </main>
</body>
</html>
