name: Validate chapter portal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply final Phase 9 reliability patch
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-9-required-forms'
        run: python3 scripts/patch_phase9_final.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)

      - name: Compile Firestore Rules
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-9-required-forms'
        env:
          CI: "true"
        run: npx --yes firebase-tools@15.2.1 emulators:exec --only firestore --project demo-tpp-chapters "echo Firestore rules compiled"

      - name: Run repository checks
        run: python3 scripts/validate_repository.py

      - name: Validate chapter ID format
        run: python3 scripts/validate_chapter_id_format.py

      - name: Validate portal routing and cache versioning
        run: python3 scripts/validate_portal_routing.py

      - name: Validate workspace invitation and activation flow
        run: python3 scripts/validate_workspace_invitation_activation.py

      - name: Validate portal chapter creation
        run: python3 scripts/validate_create_chapter_portal.py

      - name: Validate invitation-code activation
        run: python3 scripts/validate_no_email_verification.py

      - name: Validate unified chapter portal
        run: python3 scripts/validate_chapter_portal_v2.py

      - name: Validate mobile drawer and member roster
        run: python3 scripts/validate_mobile_members_roster.py

      - name: Validate support center permissions
        run: python3 scripts/validate_support_center_permissions.py

      - name: Validate Firestore attachments
        run: python3 scripts/validate_firestore_attachments.py

      - name: Validate Phase 9 required forms
        run: python3 scripts/validate_phase9.py

      - name: Commit final Phase 9 reliability patch
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-9-required-forms'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve portal navigation and attachment integrity in Phase 9" || exit 0
          git push origin HEAD:phase-9-required-forms
