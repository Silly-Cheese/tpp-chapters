name: Validate chapter portal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare member roster migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-members-roster'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_member_roster_rules.py')
          text = path.read_text()
          marker = '\nworkflow_path = Path(".github/workflows/validate.yml")'
          if marker in text:
              text = text.split(marker, 1)[0] + '\nprint("Chapter member roster rules and portal fixes applied.")\n'
          path.write_text(text)
          PY

      - name: Apply member roster rules
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-members-roster'
        run: python3 scripts/apply_member_roster_rules.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)

      - name: Run repository checks
        run: python3 scripts/validate_repository.py

      - name: Validate chapter ID format
        run: python3 scripts/validate_chapter_id_format.py

      - name: Validate portal routing and cache versioning
        run: python3 scripts/validate_portal_routing.py

      - name: Validate workspace invitation and activation flow
        run: python3 scripts/validate_workspace_invitation_activation.py

      - name: Validate portal chapter creation
        run: python3 scripts/validate_create_chapter_portal.py

      - name: Validate invitation-code activation
        run: python3 scripts/validate_no_email_verification.py

      - name: Validate unified chapter portal
        run: python3 scripts/validate_chapter_portal_v2.py

      - name: Validate mobile drawer and member roster
        run: python3 scripts/validate_mobile_members_roster.py

      - name: Commit generated rules and portal correction
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-members-roster'
        run: |
          if git diff --quiet -- firestore.rules assets/js/chapter-portal-mobile-members.js; then
            echo "Generated member roster files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules assets/js/chapter-portal-mobile-members.js
          git commit -m "Apply chapter member roster permissions"
          git push origin HEAD:fix/mobile-members-roster
