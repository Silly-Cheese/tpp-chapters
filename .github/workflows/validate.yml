name: Validate chapter portal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Firestore attachment migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/firestore-attachments'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_firestore_attachments.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('p5 = p5_path.read_text(encoding="utf-8")np5_storage_import', 'p5 = p5_path.read_text(encoding="utf-8")\np5_storage_import')
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply_firestore_attachments.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_repository.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('        "storage.rules",\n', '')
          text = text.replace('    for relative in ("firestore.rules", "storage.rules"):', '    for relative in ("firestore.rules",):')
          text = text.replace('        if "match /{allPaths=**}" not in text and relative == "storage.rules":\n            warn("Storage Rules do not contain an explicit final deny-all match.")\n', '')
          text = text.replace('        \'storageBucket: "tpp-chapters.firebasestorage.app"\',\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)

      - name: Run repository checks
        run: python3 scripts/validate_repository.py

      - name: Validate chapter ID format
        run: python3 scripts/validate_chapter_id_format.py

      - name: Validate portal routing and cache versioning
        run: python3 scripts/validate_portal_routing.py

      - name: Validate workspace invitation and activation flow
        run: python3 scripts/validate_workspace_invitation_activation.py

      - name: Validate portal chapter creation
        run: python3 scripts/validate_create_chapter_portal.py

      - name: Validate invitation-code activation
        run: python3 scripts/validate_no_email_verification.py

      - name: Validate unified chapter portal
        run: python3 scripts/validate_chapter_portal_v2.py

      - name: Validate mobile drawer and member roster
        run: python3 scripts/validate_mobile_members_roster.py

      - name: Validate support center permissions
        run: python3 scripts/validate_support_center_permissions.py

      - name: Validate Firestore attachments
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/firestore-attachments'
        run: python3 scripts/validate_firestore_attachments.py

      - name: Commit generated Firestore attachment release
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/firestore-attachments'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Firebase Storage with Firestore attachments" || exit 0
          git push origin HEAD:fix/firestore-attachments
