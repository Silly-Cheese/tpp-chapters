name: Validate chapter portal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply support attachment fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/support-attachments'
        run: python3 scripts/apply_support_attachments_fix.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)

      - name: Run repository checks
        run: python3 scripts/validate_repository.py

      - name: Validate chapter ID format
        run: python3 scripts/validate_chapter_id_format.py

      - name: Validate portal routing and cache versioning
        run: python3 scripts/validate_portal_routing.py

      - name: Validate workspace invitation and activation flow
        run: python3 scripts/validate_workspace_invitation_activation.py

      - name: Validate portal chapter creation
        run: python3 scripts/validate_create_chapter_portal.py

      - name: Validate invitation-code activation
        run: python3 scripts/validate_no_email_verification.py

      - name: Validate unified chapter portal
        run: python3 scripts/validate_chapter_portal_v2.py

      - name: Validate mobile drawer and member roster
        run: python3 scripts/validate_mobile_members_roster.py

      - name: Validate support center permissions
        run: python3 scripts/validate_support_center_permissions.py

      - name: Validate support attachments
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/support-attachments'
        run: python3 scripts/validate_support_attachments.py

      - name: Commit generated support attachment fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/support-attachments'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/phase6.js storage.rules index.html scripts/validate_*.py
          git commit -m "Fix support attachment uploads and access" || exit 0
          git push origin HEAD:fix/support-attachments
