name: Validate chapter portal

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/chapter-portal-resilience
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair migration template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_chapter_portal_resilience.py')
          text = path.read_text()
          old = """    replacement = f'''onAuthStateChanged(auth, async (user) => {{
            {'cleanupListeners();\\n  ' if phase == '6' else ''}state.user = user;""".replace('            ', '')
          new = """    cleanup_prefix = "cleanupListeners();\\n  " if phase == "6" else ""
    replacement = f'''onAuthStateChanged(auth, async (user) => {{
  {cleanup_prefix}state.user = user;"""
          if old not in text:
              raise SystemExit('Could not find migration template expression')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply chapter portal migration
        run: python3 scripts/apply_chapter_portal_resilience.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          python3 scripts/validate_repository.py
          python3 scripts/validate_chapter_id_format.py
          python3 scripts/validate_portal_routing.py
          python3 scripts/validate_workspace_invitation_activation.py
          python3 scripts/validate_create_chapter_portal.py
          python3 scripts/validate_no_email_verification.py
          python3 scripts/validate_chapter_portal_resilience.py

      - name: Commit migrated portal files
        run: |
          rm -f .github/workflows/apply-chapter-portal-resilience.yml
          rm -f scripts/apply_chapter_portal_resilience.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modernize and stabilize the chapter portal"
          git push origin HEAD:fix/chapter-portal-resilience
