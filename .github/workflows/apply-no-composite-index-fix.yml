name: Apply no-composite-index fix

on:
  push:
    branches:
      - fix/no-composite-indexes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/no-composite-indexes
          fetch-depth: 0

      - name: Remove composite-index dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          app_path = Path("assets/js/app.js")
          app = app_path.read_text(encoding="utf-8")
          old_search = '''    const registryQuery = query(
              collection(db, "publicChapterRegistry"),
              where("isPublished", "==", true),
              where("searchTokens", "array-contains", token),
              orderBy("officialName", "asc"),
              limit(20)
            );
            const snapshot = await getDocs(registryQuery);
            const records = snapshot.docs.map(recordFromSnapshot);
            root.innerHTML = records.length ? searchResultsMarkup(records, searchTerm) : registryNoMatches(searchTerm);'''
          new_search = '''    const snapshot = await getDocs(query(
              collection(db, "publicChapterRegistry"),
              where("isPublished", "==", true)
            ));
            const normalizedPhrase = searchTerm.toLowerCase().normalize("NFKD").replace(/[\\u0300-\\u036f]/g, "");
            const records = snapshot.docs
              .map(recordFromSnapshot)
              .filter((record) => {
                const searchable = [
                  record.chapterId,
                  record.officialName,
                  record.hostInstitutionName,
                  record.city,
                  record.state,
                  record.country,
                  ...(Array.isArray(record.searchTokens) ? record.searchTokens : [])
                ].join(" ").toLowerCase().normalize("NFKD").replace(/[\\u0300-\\u036f]/g, "");
                return searchable.includes(normalizedPhrase) || searchable.split(/\\s+/).includes(token);
              })
              .sort((a, b) => String(a.officialName || a.chapterId).localeCompare(String(b.officialName || b.chapterId)))
              .slice(0, 20);
            root.innerHTML = records.length ? searchResultsMarkup(records, searchTerm) : registryNoMatches(searchTerm);'''
          app = must_replace(app, old_search, new_search, "public registry search")

          directory_pattern = re.compile(r'''async function loadDirectory\(\{ reset = false \} = \{\}\) \{.*?\n\}\n\nfunction directoryMarkup\(\) \{''', re.S)
          new_directory = '''async function loadDirectory({ reset = false } = {}) {
            const root = document.querySelector("#directory-results");
            if (!root || state.directory.loading) return;
            if (reset) {
              state.directory = { records: [], cursor: null, hasMore: false, loading: false, loaded: false, error: null };
              root.innerHTML = registryLoading("Loading published chapters…");
            }
            state.directory.loading = true;
            try {
              const snapshot = await getDocs(query(
                collection(db, "publicChapterRegistry"),
                where("isPublished", "==", true)
              ));
              state.directory.records = snapshot.docs
                .map(recordFromSnapshot)
                .sort((a, b) => String(a.officialName || a.chapterId).localeCompare(String(b.officialName || b.chapterId)));
              state.directory.cursor = null;
              state.directory.hasMore = false;
              state.directory.loaded = true;
              root.innerHTML = directoryMarkup();
              bindDynamicRegistryEvents();
            } catch (error) {
              console.error("Unable to load chapter directory.", error);
              state.directory.error = error;
              root.innerHTML = registryError("Directory unavailable", "The directory could not be loaded. Confirm that the public registry rules are deployed.");
            } finally {
              state.directory.loading = false;
            }
          }

          function directoryMarkup() {'''
          app, count = directory_pattern.subn(new_directory, app, count=1)
          if count != 1:
              raise SystemExit("Expected loadDirectory function was not found")
          app = app.replace("The required Firestore index may still be building or the security rules may not be deployed.", "The public registry rules may not be deployed or the service may be temporarily unavailable.")
          app = app.replace("Confirm that the public registry index and security rules are deployed.", "Confirm that the public registry rules are deployed.")
          app_path.write_text(app, encoding="utf-8")

          phase6_path = Path("assets/js/phase6.js")
          phase6 = phase6_path.read_text(encoding="utf-8")
          old_ticket_queries = '''  const shared = query(collection(db, "supportTickets"), where("accessKeys", "array-contains", `chapter:${state.selectedChapterId}`));
            const personal = query(collection(db, "supportTickets"), where("accessKeys", "array-contains", `user:${state.user.uid}`));'''
          new_ticket_queries = '''  const shared = query(
              collection(db, "supportTickets"),
              where("chapterId", "==", state.selectedChapterId),
              where("visibility", "==", "chapter")
            );
            const personal = query(
              collection(db, "supportTickets"),
              where("chapterId", "==", state.selectedChapterId),
              where("visibility", "==", "adviser_private"),
              where("createdByUid", "==", state.user.uid)
            );'''
          phase6 = must_replace(phase6, old_ticket_queries, new_ticket_queries, "support ticket queries")
          old_path = '''    const path = `support-attachments/${ticket.chapterId}/${ticket.id}/${messageId}/${state.user.uid}/${fileName}`;'''
          new_path = '''    const uploaderType = SUPPORT_STAFF_ROLES.has(state.profile?.systemRole) ? "staff" : "chapter";
              const path = `support-attachments/${uploaderType}/${ticket.chapterId}/${ticket.id}/${messageId}/${state.user.uid}/${fileName}`;'''
          phase6 = must_replace(phase6, old_path, new_path, "support attachment path")
          phase6_path.write_text(phase6, encoding="utf-8")
          Path("assets/js/phase6-loader.js").write_text('import "./phase6.js";\n', encoding="utf-8")

          phase8_path = Path("assets/js/phase8.js")
          phase8 = phase8_path.read_text(encoding="utf-8")
          phase8 = must_replace(phase8, '''  limit,
            query
          }''', '''  limit,
            query,
            where
          }''', "Phase 8 Firestore import")
          old_loop = '''  for (const collectionName of COLLECTION_CHECKS) {
              try {
                await getDocs(query(collection(db, collectionName), limit(1)));
                add(`Firestore: ${collectionName}`, "pass", "The current administrator can read this collection.");
              } catch (error) {
                add(`Firestore: ${collectionName}`, "fail", error?.message || "Firestore denied or failed this collection read.");
              }
            }'''
          new_loop = '''  for (const collectionName of COLLECTION_CHECKS) {
              try {
                const healthQuery = collectionName === "publicChapterRegistry"
                  ? query(collection(db, collectionName), where("isPublished", "==", true), limit(1))
                  : query(collection(db, collectionName), limit(1));
                await getDocs(healthQuery);
                add(`Firestore: ${collectionName}`, "pass", "The current administrator can perform the read used by this portal area.");
              } catch (error) {
                add(`Firestore: ${collectionName}`, "fail", error?.message || "Firestore denied or failed this portal read.");
              }
            }'''
          phase8 = must_replace(phase8, old_loop, new_loop, "Phase 8 diagnostics collection loop")
          phase8_path.write_text(phase8, encoding="utf-8")

          rules_path = Path("firestore.rules")
          rules = rules_path.read_text(encoding="utf-8")
          rules = must_replace(rules, '''    match /supportTickets/{ticketId} {
              allow read: if canAccessSupportTicketData(resource.data);''', '''    match /supportTickets/{ticketId} {
              allow read: if canManageSupport();
              allow read: if canAccessSupportTicketData(resource.data);''', "support ticket administrative read rule")
          rules_path.write_text(rules, encoding="utf-8")

          Path("firestore.indexes.json").write_text(json.dumps({"indexes": [], "fieldOverrides": []}, indent=2) + "\n", encoding="utf-8")

          for path in [Path("README.md"), *Path("docs").glob("*.md"), *Path(".").glob("PHASE-*-NOTES.md")]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("firebase deploy --only firestore:rules,firestore:indexes,storage", "firebase deploy --only firestore:rules,storage")
              path.write_text(text, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "## Required Firebase setup"
          note = "## Firestore indexes\n\nThe portal does not require custom composite indexes. Registry search and sorting are performed safely after a single-field published-record query, and support access uses equality filters supported by Firestore index merging. Firebase's automatic single-field indexes remain enabled.\n\n"
          if note not in readme:
              readme = readme.replace(marker, note + marker, 1)
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Validate JavaScript and repository
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 scripts/validate_repository.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          indexes = json.loads(Path('firestore.indexes.json').read_text())
          assert indexes['indexes'] == [], 'Composite indexes still configured'
          app = Path('assets/js/app.js').read_text()
          phase6 = Path('assets/js/phase6.js').read_text()
          assert 'array-contains' not in app
          assert 'array-contains' not in phase6
          assert 'orderBy("officialName"' not in app
          print('No composite-index-dependent queries remain.')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/apply-no-composite-index-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove composite Firestore index requirements"
          git push origin HEAD:fix/no-composite-indexes
