name: Apply flexible chapter ID fix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_flexible_chapter_id_fix.py'
      - '.github/workflows/apply-flexible-chapter-id-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/flexible-chapter-ids'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/flexible-chapter-ids
          fetch-depth: 0

      - name: Apply flexible chapter ID migration
        run: python3 scripts/apply_flexible_chapter_id_fix.py

      - name: Validate JavaScript and repository
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          python3 scripts/validate_repository.py
          python3 scripts/validate_chapter_id_format.py
          python3 - <<'PY'
          from pathlib import Path
          rules = Path('firestore.rules').read_text()
          assert rules.count('validChapterId(') >= 4, 'Not all Firestore chapter ID validations were migrated'
          assert 'chapterId.size() == 18' not in rules
          assert 'TPP-CH-YYYY' not in '\n'.join(
              p.read_text(errors='ignore')
              for p in [*Path('assets/js').glob('*.js'), *Path('docs').rglob('*.md')]
          )
          print('Chapter ID migration validation passed.')
          PY

      - name: Commit fix and remove migration files
        run: |
          rm -f .github/workflows/apply-flexible-chapter-id-fix.yml
          rm -f scripts/apply_flexible_chapter_id_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support flexible alphanumeric chapter IDs"
          git push origin HEAD:fix/flexible-chapter-ids
