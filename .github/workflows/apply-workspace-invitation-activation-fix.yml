name: Apply workspace invitation and activation fix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_workspace_invitation_activation_fix.py'
      - '.github/workflows/apply-workspace-invitation-activation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/workspace-invitations-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/workspace-invitations-activation
          fetch-depth: 0

      - name: Apply repair migration
        run: python3 scripts/apply_workspace_invitation_activation_fix.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          python3 scripts/validate_repository.py
          python3 scripts/validate_chapter_id_format.py
          python3 scripts/validate_portal_routing.py
          python3 scripts/validate_workspace_invitation_activation.py

      - name: Commit repair and remove migration files
        run: |
          rm -f .github/workflows/apply-workspace-invitation-activation-fix.yml
          rm -f scripts/apply_workspace_invitation_activation_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair chapter workspace invitations and activation"
          git push origin HEAD:fix/workspace-invitations-activation
