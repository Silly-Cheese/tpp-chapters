name: Apply portal chapter creation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_create_chapter_portal.py'
      - '.github/workflows/apply-create-chapter-portal.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/create-chapter-from-portal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/create-chapter-from-portal
          fetch-depth: 0

      - name: Keep permanent CI workflow unchanged during migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_create_chapter_portal.py')
          text = path.read_text()
          old = 'save(workflow_path, workflow_before, workflow_after)'
          new = 'workflow_after = workflow_before\nsave(workflow_path, workflow_before, workflow_after)'
          if old not in text:
              raise SystemExit('Permanent workflow write anchor was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply portal chapter creation migration
        run: python3 scripts/apply_create_chapter_portal.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          python3 scripts/validate_repository.py
          python3 scripts/validate_chapter_id_format.py
          python3 scripts/validate_portal_routing.py
          python3 scripts/validate_workspace_invitation_activation.py
          python3 scripts/validate_create_chapter_portal.py

      - name: Commit feature and remove migration files
        run: |
          rm -f .github/workflows/apply-create-chapter-portal.yml
          rm -f scripts/apply_create_chapter_portal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create chapters directly from the administration portal"
          git push origin HEAD:fix/create-chapter-from-portal
