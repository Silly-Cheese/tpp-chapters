name: Apply Phase 8 settings rule

on:
  push:
    branches:
      - phase-8-production-finalization
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-rule:
    if: github.event_name == 'push' || github.head_ref == 'phase-8-production-finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 8 branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-production-finalization
          fetch-depth: 0

      - name: Permit public reads of safe portal settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("firestore.rules")
          text = path.read_text(encoding="utf-8")
          if "allow get: if documentId == 'portal' || isActive();" in text:
              print("Phase 8 system settings rule is already present.")
          else:
              pattern = re.compile(
                  r"(?m)^(?P<indent>[ \t]*)match /systemSettings/\{documentId\} \{\s*\n"
                  r"[ \t]*allow read: if isActive\(\);\s*\n"
                  r"[ \t]*allow create, update, delete: if isOwner\(\);\s*\n"
                  r"[ \t]*\}"
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit("Expected systemSettings rule block was not found.")
              indent = match.group("indent")
              replacement = (
                  f"{indent}match /systemSettings/{{documentId}} {{\n"
                  f"{indent}  allow get: if documentId == 'portal' || isActive();\n"
                  f"{indent}  allow list: if isActive();\n"
                  f"{indent}  allow create, update, delete: if isOwner();\n"
                  f"{indent}}}"
              )
              path.write_text(pattern.sub(replacement, text, count=1), encoding="utf-8")
          PY

      - name: Validate repository
        run: python3 scripts/validate_repository.py

      - name: Commit rule and remove temporary workflow
        run: |
          rm .github/workflows/apply-phase8-settings-rule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/apply-phase8-settings-rule.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Phase 8: expose safe portal settings for public feature gates"
          git push origin HEAD:phase-8-production-finalization
