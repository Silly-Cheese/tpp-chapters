name: Apply no-composite-index fix on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_no_composite_fix.py'
      - '.github/workflows/apply-no-composite-index-fix-pr.yml'
      - '.github/workflows/apply-no-composite-index-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/no-composite-indexes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/no-composite-indexes
          fetch-depth: 0

      - name: Make migration replacements safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_no_composite_fix.py')
          text = path.read_text()
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = "updated, count = re.subn(pattern, lambda _match: _match.expand(replacement) if ('\\\\1' in replacement or '\\\\2' in replacement) else replacement, text, count=1, flags=flags)"
          if old not in text:
              raise SystemExit('Migration helper line was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply no-composite-index patch
        run: python3 scripts/apply_no_composite_fix.py

      - name: Validate JavaScript and repository
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 scripts/validate_repository.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          indexes = json.loads(Path('firestore.indexes.json').read_text())
          assert indexes['indexes'] == [], 'Composite indexes still configured'
          app = Path('assets/js/app.js').read_text()
          phase6 = Path('assets/js/phase6.js').read_text()
          assert 'array-contains' not in app
          assert 'array-contains' not in phase6
          assert 'orderBy("officialName"' not in app
          assert 'firestore:indexes' not in Path('README.md').read_text()
          print('Composite-index-free validation passed.')
          PY

      - name: Commit fix and remove temporary migration files
        run: |
          rm -f .github/workflows/apply-no-composite-index-fix.yml
          rm -f .github/workflows/apply-no-composite-index-fix-pr.yml
          rm -f scripts/apply_no_composite_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove composite Firestore index requirements"
          git push origin HEAD:fix/no-composite-indexes
