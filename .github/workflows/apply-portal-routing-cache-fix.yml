name: Apply portal routing and cache fix

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_portal_routing_cache_fix.py'
      - '.github/workflows/apply-portal-routing-cache-fix.yml'
      - 'assets/portal-hotfix.css'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/portal-routing-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/portal-routing-cache
          fetch-depth: 0

      - name: Apply portal routing and cache migration
        run: python3 scripts/apply_portal_routing_cache_fix.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          python3 scripts/validate_repository.py
          python3 scripts/validate_chapter_id_format.py
          python3 scripts/validate_portal_routing.py

      - name: Commit fix and remove migration files
        run: |
          rm -f .github/workflows/apply-portal-routing-cache-fix.yml
          rm -f scripts/apply_portal_routing_cache_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route users to the complete portal and bust stale assets"
          git push origin HEAD:fix/portal-routing-cache
